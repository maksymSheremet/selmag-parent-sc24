spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/catalogue
    username: catalogue
    password: catalogue
  flyway:
    schemas:
      - public
      - catalogue
  jpa:
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8083/realms/selmag

server:
  port: 8082

logging:
  level:
    sql: info